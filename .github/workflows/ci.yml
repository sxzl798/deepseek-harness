name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Allow lefthook to install hooks
        run: echo "DSH_LEFTHOOK_ALLOW_HOOKS_PATH_OVERRIDE=1" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Agenthub smoke (registry + skills + doctor)
        run: pnpm tsx scripts/smoke-agenthub.mts

      - name: Session log smoke
        run: pnpm tsx scripts/smoke-sessions.mts

      - name: Profiles + bundles smoke
        run: pnpm tsx scripts/smoke-profiles-bundles.mts

      - name: Plugin loads under dsh
        run: |
          DSH_LEFTHOOK_ALLOW_HOOKS_PATH_OVERRIDE=1 pnpm dsh \
            --profile web \
            --patch ./contrib/agenthub/cordis.yml \
            --no-open --port 18999 2>&1 &
          DSH_PID=$!
          for i in $(seq 1 30); do
            sleep 1
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:18999/ 2>/dev/null | grep -qE '200|3..'; then
              break
            fi
          done

          # REST API: status must return 200 with a projectCount field
          STATUS_CODE=$(curl -s -o /tmp/status.json -w "%{http_code}" http://localhost:18999/agenthub-api/status)
          echo "GET /agenthub-api/status = $STATUS_CODE"
          if [ "$STATUS_CODE" != "200" ]; then
            echo "::error::status endpoint did not return 200"
            kill $DSH_PID 2>/dev/null || true
            exit 1
          fi
          if ! grep -q projectCount /tmp/status.json; then
            echo "::error::status response missing projectCount"
            kill $DSH_PID 2>/dev/null || true
            exit 1
          fi

          # REST API: projects endpoint must return 17 projects
          PROJ_CODE=$(curl -s -o /tmp/projects.json -w "%{http_code}" http://localhost:18999/agenthub-api/projects)
          echo "GET /agenthub-api/projects = $PROJ_CODE"
          PROJ_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/projects.json')).get('projects', [])))")
          echo "project count = $PROJ_COUNT"
          if [ "$PROJ_CODE" != "200" ] || [ "$PROJ_COUNT" -lt 1 ]; then
            echo "::error::projects endpoint broken (code=$PROJ_CODE, count=$PROJ_COUNT)"
            kill $DSH_PID 2>/dev/null || true
            exit 1
          fi

          # Web UI: /agenthub-ui must serve the dashboard HTML
          UI_CODE=$(curl -s -o /tmp/ui.html -w "%{http_code}" http://localhost:18999/agenthub-ui)
          echo "GET /agenthub-ui = $UI_CODE"
          if [ "$UI_CODE" != "200" ]; then
            echo "::error::UI endpoint did not return 200"
            kill $DSH_PID 2>/dev/null || true
            exit 1
          fi
          if ! grep -q "agenthub 控制台" /tmp/ui.html; then
            echo "::error::UI HTML missing expected Chinese title"
            kill $DSH_PID 2>/dev/null || true
            exit 1
          fi
          if ! grep -q "/agenthub-api/projects" /tmp/ui.html; then
            echo "::error::UI HTML missing REST API endpoint reference"
            kill $DSH_PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ All 3 endpoints + UI HTML OK"

          kill $DSH_PID 2>/dev/null || true
          wait $DSH_PID 2>/dev/null || true