name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Allow lefthook to install hooks
        run: echo "DSH_LEFTHOOK_ALLOW_HOOKS_PATH_OVERRIDE=1" >> "$GITHUB_ENV"

      - name: Install
        run: pnpm install --prefer-offline

      - name: Build
        run: pnpm run build

      - name: Agenthub smoke (registry + skills + doctor)
        run: pnpm tsx scripts/smoke-agenthub.mts

      - name: Session log smoke
        run: pnpm tsx scripts/smoke-sessions.mts

      - name: Profiles + bundles smoke
        run: pnpm tsx scripts/smoke-profiles-bundles.mts

      - name: Plugin loads under dsh
        run: |
          DSH_LEFTHOOK_ALLOW_HOOKS_PATH_OVERRIDE=1 pnpm dsh \
            --profile web \
            --patch ./contrib/agenthub/cordis.yml \
            --no-open --port 18999 2>&1 &
          DSH_PID=$!
          for i in $(seq 1 20); do
            sleep 1
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:18999/ 2>/dev/null | grep -q 200; then
              break
            fi
          done
          curl -s -o /dev/null -w "GET /agenthub-api/status = %{http_code}\n" http://localhost:18999/agenthub-api/status
          curl -s http://localhost:18999/agenthub-api/status | head -1
          kill $DSH_PID 2>/dev/null || true
          wait $DSH_PID 2>/dev/null || true
          # Fail the job if status endpoint didn't return 200
          if ! curl -s -o /dev/null -w "%{http_code}" http://localhost:18999/agenthub-api/status | grep -q 200; then
            echo "::error::status endpoint did not respond 200"
            exit 1
          fi